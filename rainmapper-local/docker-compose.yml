services:
  rainmapper:
    build:
      context: ..
      dockerfile: rainmapper-local/Dockerfile
    image: rainmapperha:test
    environment:
      RAINMAPPER_MODE: "once"
      RAINMAPPER_SCHEDULE_TIME: "23:50"
      RAINMAPPER_TIMEZONE: "Europe/Madrid"
      GMAP_API_KEY: ${GMAP_API_KEY}
      RAINMAPPER_DAYS_INIT: "-7"
      RAINMAPPER_DAYS_END: "0"
      RAINMAPPER_CREATE_WUNDERGROUND: "true"
      RAINMAPPER_CREATE_METEOCLIMATIC: "true"
      RAINMAPPER_CREATE_METEOCAT: "true"
      RAINMAPPER_NOMAPS: "false"
      RAINMAPPER_NOTOTALS: "true"
      RAINMAPPER_DAYS_BUCKET: "10"
      MAX_THREADS: "${MAX_THREADS:-}"
      RAINMAPPER_MAX_THREADS: "${RAINMAPPER_MAX_THREADS:-3}"
      RAINMAPPER_MAX_ATTEMPTS: "3"
      RAINMAPPER_WUNDERGROUND_FULL_LOG: "false"
      RAINMAPPER_METEOCLIMATIC_PATTERN: "ESCAT;ESARA;ESCLM"
      RAINMAPPER_IGNORE_STATIONS_TOMAP_FILE: "/rainmapper-data/ignore_stations_tomap.txt"
    volumes:
      - ../docker-data/Data:/app/Data
      - ../docker-data/Tomap:/app/Tomap
      - ../docker-data/Plots:/app/Plots
      - ../docker-data/PublicData:/app/PublicData
      - ../docker-data/stations.txt:/app/stations.txt
      - ../docker-data:/rainmapper-data

  rainmapper-ha-ui:
    build:
      context: ..
      dockerfile: rainmapper-app/Dockerfile
    image: rainmapperha:local-ha-ui
    environment:
      RAINMAPPER_APP_VERSION: local-ha-ui
      RAINMAPPER_LOCAL_REPO_ROOT: ${RAINMAPPER_LOCAL_REPO_ROOT:-}
    ports:
      - "127.0.0.1:8101:8099"
    volumes:
      - ../docker-data:/share/rainmapper
      - ../mushroom-GIS:/app/mushroom-GIS:ro
      - ../tmp:/app/tmp
      - ./options.local-ha-ui.json:/data/options.json:ro
      - ../tmp/mushroom-lab/runtime/config-www:/config/www
