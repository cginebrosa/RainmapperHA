<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rainmapper Mobile</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQzCZqOzyzyDP1CrDdNLK1skZbKkW3s="
      crossorigin=""
    >
    <link rel="stylesheet" href="style.css?v=0.2.240">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-title">
        <h1>Rainmapper</h1>
        <p id="summary">Loading map data...</p>
      </div>
      <div class="generated">
        <span>Generated</span>
        <time id="generated-at">-</time>
      </div>
      <select id="map-selector" aria-label="Rain period">
        <option value="01d.geojson">1 day</option>
        <option value="07d.geojson">7 days</option>
        <option value="14d.geojson">14 days</option>
        <option value="21d.geojson" selected>21 days</option>
        <option value="30d.geojson">30 days</option>
        <option value="60d.geojson">60 days</option>
        <option value="90d.geojson">90 days</option>
      </select>
    </header>

    <main>
      <div id="map"></div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  <script src="config.js?v=0.2.240"></script>
  <script src="app.js?v=0.2.240"></script>
  </body>
</html>
