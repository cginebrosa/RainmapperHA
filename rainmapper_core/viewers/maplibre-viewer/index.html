<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rainmapper MapLibre</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    >
    <link rel="stylesheet" href="style.css?v=0.2.82">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-title">
        <h1>Rainmapper</h1>
        <p id="summary">Loading map data...</p>
      </div>
      <div class="generated">
        <span>Generated</span>
        <time id="generated-at">-</time>
      </div>
      <select class="period-select-native" id="map-selector" aria-label="Rain period" tabindex="-1">
        <option value="01d.geojson">1 day</option>
        <option value="07d.geojson">7 days</option>
        <option value="14d.geojson">14 days</option>
        <option value="21d.geojson" selected>21 days</option>
        <option value="30d.geojson">30 days</option>
        <option value="60d.geojson">60 days</option>
        <option value="90d.geojson">90 days</option>
      </select>
    </header>

    <main>
      <div id="map"></div>

      <section class="login-overlay" id="login-overlay" aria-label="Rainmapper login" hidden>
        <form class="login-card" id="login-form" autocomplete="on">
          <div>
            <h2>Rainmapper</h2>
            <p>Sign in to view protected maps from this device.</p>
          </div>
          <label>
            <span>Email</span>
            <input id="login-email" name="email" type="email" autocomplete="username" required>
          </label>
          <label>
            <span>Password</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>
          <button class="login-submit" type="submit">Sign in</button>
        </form>
      </section>
      <div class="map-floating-controls" aria-label="Map controls">
        <button class="map-control-button map-settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="map-settings" aria-label="Map settings" title="Map settings">
          <span aria-hidden="true">•••</span>
        </button>
        <button class="map-control-button terrain-mode-toggle" id="terrain-mode-toggle" type="button" aria-pressed="false" aria-label="Toggle 3D terrain" title="Toggle 3D terrain">
          2D
        </button>
        <button class="map-control-button map-north-toggle" id="north-toggle" type="button" aria-label="Face north" title="Face north">
          <span aria-hidden="true"></span>
        </button>
        <button class="map-control-button map-info-toggle" id="info-toggle" type="button" aria-expanded="false" aria-controls="map-attribution" aria-label="Map credits" title="Map credits">
          i
        </button>
      </div>
      <section class="map-attribution" id="map-attribution" aria-label="Map credits" hidden>
        <strong>Credits</strong>
        <a href="https://www.esri.com/" target="_blank" rel="noopener noreferrer">Tiles © Esri</a>
        <a href="https://maplibre.org/" target="_blank" rel="noopener noreferrer">MapLibre</a>
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a>
        <a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank" rel="noopener noreferrer">Elevation tiles © Mapzen</a>
      </section>
      <section class="map-settings" id="map-settings" aria-label="Map settings" hidden>
        <div class="map-settings-row">
          <label for="min-rain-filter">Min rain</label>
          <output id="min-rain-value" for="min-rain-filter">0 mm</output>
        </div>
        <input id="min-rain-filter" type="range" min="0" max="100" step="1" value="0">
        <div class="map-settings-row">
          <label for="last-rain-history-filter">Last rains history</label>
          <output id="last-rain-history-value" for="last-rain-history-filter">-</output>
        </div>
        <input id="last-rain-history-filter" type="range" min="1" max="1" step="1" value="1" disabled>
        <fieldset class="map-settings-group map-layer-settings-group" id="layer-switcher">
          <legend>Map</legend>
        </fieldset>
        <fieldset class="map-settings-group source-settings-group">
          <legend>Source</legend>
          <label>
            <input type="checkbox" name="station-source" value="Meteocat" checked>
            <span>Meteocat</span><span class="source-status-pill" data-source-status="Meteocat">Unknown</span>
          </label>
          <label>
            <input type="checkbox" name="station-source" value="Meteoclimatic" checked>
            <span>Meteoclimatic</span><span class="source-status-pill" data-source-status="Meteoclimatic">Unknown</span>
          </label>
          <label>
            <input type="checkbox" name="station-source" value="Wunderground" checked>
            <span>Wunderground</span><span class="source-status-pill" data-source-status="Wunderground">Unknown</span>
          </label>
          <label>
            <input type="checkbox" name="station-source" value="Unknown" checked>
            <span>Unknown</span><span class="source-status-pill source-status-unknown">No status</span>
          </label>
        </fieldset>
        <fieldset class="map-settings-group">
          <legend>Terrain</legend>
          <label>
            <input type="checkbox" id="terrain-toggle">
            <span>3D terrain</span>
          </label>
          <div class="map-settings-row">
            <label for="terrain-exaggeration">Exaggeration</label>
            <output id="terrain-exaggeration-value" for="terrain-exaggeration">1.0x</output>
          </div>
          <input id="terrain-exaggeration" type="range" min="0.5" max="3" step="0.1" value="1" disabled>
        </fieldset>
      </section>
      <nav class="period-timeline" id="period-timeline" aria-label="Rain period"></nav>
      <div class="rain-legend maplibre-rain-legend" aria-label="Rain legend">
        <div class="rain-legend-title">mm</div>
        <div class="rain-legend-scale" aria-hidden="true"></div>
        <div class="rain-legend-labels" id="rain-legend-labels">
          <span>200+</span>
          <span>150</span>
          <span>100</span>
          <span>60</span>
          <span>30</span>
          <span>15</span>
          <span>5</span>
          <span>0</span>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="config.js?v=0.2.82"></script>
    <script src="app.js?v=0.2.82"></script>
  </body>
</html>
