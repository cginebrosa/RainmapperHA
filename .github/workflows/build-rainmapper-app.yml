name: Build Rainmapper HA app image

on:
  push:
    branches:
      - inicial
    paths:
      - ".github/workflows/build-rainmapper-app.yml"
      - "rainmapper-app/**"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/cginebrosa/rainmapperha

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' rainmapper-app/config.yaml | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read version from rainmapper-app/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./rainmapper-app
          file: ./rainmapper-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
