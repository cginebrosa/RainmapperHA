name: Rainmapper
version: "0.2.11"
slug: rainmapper
description: Descarga datos meteorologicos y genera ficheros Tomap/Plots para Rainmapper.
url: https://github.com/cginebrosa/RainmapperHA
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-pouring
panel_title: Rainmapper
map:
  - type: share
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  mode: serve
  timezone: Europe/Madrid
  schedule_enabled: false
  schedule_time: "23:50"
  schedule_days: "all"
  scheduled_action: all
  days_init: -7
  days_end: 0
  create_meteoclimatic: true
  create_meteocat: true
  create_wunderground: true
  meteoclimatic_pattern: ESCAT
  nomaps: false
  nototals: false
  days_bucket: 10
  max_threads: 1
  max_attempts: 3
  wunderground_full_log: false
  publish_to_www: true
  gmap_api_key: ""
schema:
  mode: list(help|update|maps|all|serve)
  timezone: str
  schedule_enabled: bool
  schedule_time: str
  schedule_days: str
  scheduled_action: list(update|maps|all)
  days_init: int
  days_end: int
  create_meteoclimatic: bool
  create_meteocat: bool
  create_wunderground: bool
  meteoclimatic_pattern: str
  nomaps: bool
  nototals: bool
  days_bucket: int
  max_threads: int
  max_attempts: int
  wunderground_full_log: bool
  publish_to_www: bool
  gmap_api_key: password
