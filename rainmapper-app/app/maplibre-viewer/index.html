<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rainmapper MapLibre</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    >
    <link rel="stylesheet" href="style.css?v=0.2.58">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-title">
        <h1>Rainmapper</h1>
        <p id="summary">Loading map data...</p>
      </div>
      <div class="generated">
        <span>Generated</span>
        <time id="generated-at">-</time>
      </div>
      <select id="map-selector" aria-label="Rain period">
        <option value="01d.geojson">1 day</option>
        <option value="07d.geojson">7 days</option>
        <option value="14d.geojson">14 days</option>
        <option value="21d.geojson" selected>21 days</option>
        <option value="30d.geojson">30 days</option>
        <option value="60d.geojson">60 days</option>
        <option value="90d.geojson">90 days</option>
      </select>
    </header>

    <main>
      <div id="map"></div>
      <div class="maplibre-layer-switcher" id="layer-switcher"></div>
      <button class="map-settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="map-settings">
        Settings
      </button>
      <section class="map-settings" id="map-settings" aria-label="Map settings" hidden>
        <div class="map-settings-row">
          <label for="min-rain-filter">Min rain</label>
          <output id="min-rain-value" for="min-rain-filter">0 mm</output>
        </div>
        <input id="min-rain-filter" type="range" min="0" max="100" step="1" value="0">
        <fieldset class="map-settings-group">
          <legend>Stations</legend>
          <label>
            <input type="checkbox" name="station-source" value="Meteocat" checked>
            <span>Meteocat</span>
          </label>
          <label>
            <input type="checkbox" name="station-source" value="Meteoclimatic" checked>
            <span>Meteoclimatic</span>
          </label>
          <label>
            <input type="checkbox" name="station-source" value="Wunderground" checked>
            <span>Wunderground</span>
          </label>
        </fieldset>
      </section>
      <div class="rain-legend maplibre-rain-legend">
        <div class="rain-legend-title">Rain</div>
        <div class="rain-legend-row"><span class="rain-legend-swatch" style="background:#4ea5ff"></span><span>0-4.9</span></div>
        <div class="rain-legend-row"><span class="rain-legend-swatch" style="background:#ffd166"></span><span>5-14.9</span></div>
        <div class="rain-legend-row"><span class="rain-legend-swatch" style="background:#ff9f32"></span><span>15-29.9</span></div>
        <div class="rain-legend-row"><span class="rain-legend-swatch" style="background:#ff4b2f"></span><span>30-59.9</span></div>
        <div class="rain-legend-row"><span class="rain-legend-swatch" style="background:#c0002b"></span><span>60-99.9</span></div>
        <div class="rain-legend-row"><span class="rain-legend-swatch" style="background:#7a001f"></span><span>100+</span></div>
      </div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="config.js?v=0.2.58"></script>
    <script src="app.js?v=0.2.58"></script>
  </body>
</html>
