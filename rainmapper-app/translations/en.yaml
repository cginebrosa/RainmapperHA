configuration:
  prediction_competing_selection:
    name: Competing selection
    description: Default for the optional A–B–C–D comparison in the prediction map. Each device can override or inherit it.
  prediction_k_value:
    name: K value
    description: Cost of historical false favorable advice when ranking comparison candidates. Higher utility wins. Each device can override or inherit it.
  maplibre_observations_mobile_enabled:
    name: Allow observation map on mobile
    description: Show the observation layer control on phones. Disabled by default; the user must also have Observation map access.
  external_worker_connections_enabled:
    name: Enable external worker connections
    description: Allow paired Rainmapper workers to connect to the dedicated private coordinator port.
  external_worker_rebuilds_enabled:
    name: Allow external rebuilds and promotion
    description: Allow connected workers to run real rebuilds and make verified candidates eligible for explicit promotion.
  ml_storage_reconciliation_apply:
    name: Apply ML storage retention
    description: Apply audited ML and worker storage cleanup at Rainmapper startup and lifecycle checkpoints. Keep disabled for dry-run reporting only.
network:
  8099/TCP: Rainmapper web server for Ingress, MapLibre, and existing protected web access
  8100/TCP: Private Rainmapper external worker coordinator
